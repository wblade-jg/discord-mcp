[project]
name = "discord-mcp"
version = "0.1.0"
description = "Servidor MCP para Discord construido desde cero."
readme = "README.md"
authors = [
    { name = "wblade-jg", email = "juliangarzonalvarezwb9@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.2.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[project.scripts]
discord-mcp = "discord_mcp.main:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
